# D-086 arm `adv`, fold 13: `read` + an adversarial loss: a multiscale discriminator learns to tell this map's voice
# from the decoder's attempted-speech voice (F_13 on attempted blocks [3, 6, 11]); the map learns to fool it.
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_kunz_d086_adv_k13.yaml
base_experiment: configs/experiments/b2v2_kunz_d086_read_k13.yaml

run_name: b2v2_kunz_d086_adv_k13

b2v2:
  adapt:
    adversarial:                     # [OURS] an unpaired version of the paper's multiscale discriminator, scaled to a
                                     # 1,000-step adaptation: real = the decoder's attempted-speech voice (other blocks)
      real: [b2v2_kunz_f13:attempted_train]
      start: 200                     # generator loss from step 200 (D trains from step 0)
      ramp: 500
      w_from: 0.1                    # paper 0.01 -> 0.1 next to a CTC weight of 0.1; ours next to CTC weight 1
      w_to: 1.0
      d_lr: 2.0e-4                   # paper 5e-5 over 25k steps; ours a common GAN default for 1,000 steps
      d_weight_decay: 0.01           # [PAPER]
      d_every: 1                     # paper 2; every step here (short run)
      scales: [1, 3, 6]              # 50 / 150 / 300 ms on 50 ms tokens (paper 10 / 40 / 160 / 320 ms on 10 ms)
      channels: [64, 128, 256]       # [PAPER]
      kernel: 3
