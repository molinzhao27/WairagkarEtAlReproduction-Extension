# D-099 analysis (PC CPU, gq): T15's inner-speech voice with D-086's voice target vs D-097 `unfreeze`.
#   PC: CUDA_VISIBLE_DEVICES= .venv/bin/python -I scripts/d099_voice.py --config configs/experiments/b2v2_kunz_d099.yaml
base_experiment: configs/experiments/b2v2_kunz_base.yaml

run_name: b2v2_kunz_d099

b2v2:
  d099:
    out: results/b2v2/d099
    n_trials: 200
    alpha: 0.05
    min_gain: 3.0
    arm: voice
    baseline: base
    cells:
      base: [{runs: [b2v2_kunz_d097_unfreeze_s0_k03, b2v2_kunz_d097_unfreeze_s0_k06, b2v2_kunz_d097_unfreeze_s0_k11, b2v2_kunz_d097_unfreeze_s0_k13], identify: d097_unfreeze_s0}, {runs: [b2v2_kunz_d097_unfreeze_s1_k03, b2v2_kunz_d097_unfreeze_s1_k06, b2v2_kunz_d097_unfreeze_s1_k11, b2v2_kunz_d097_unfreeze_s1_k13], identify: d097_unfreeze_s1}]
      voice: [{runs: [b2v2_kunz_d099_voice_s0_k03, b2v2_kunz_d099_voice_s0_k06, b2v2_kunz_d099_voice_s0_k11, b2v2_kunz_d099_voice_s0_k13], identify: d099_voice_s0}, {runs: [b2v2_kunz_d099_voice_s1_k03, b2v2_kunz_d099_voice_s1_k06, b2v2_kunz_d099_voice_s1_k11, b2v2_kunz_d099_voice_s1_k13], identify: d099_voice_s1}]
