# D-054 (pre-registered): the D-049 dev setting with the TTS voice "Aman kNN-VC" (tts_oracle / tts_auto placements of that
# voice). Compared with D-050/D-051/D-052 (same machine, test trials and scoring; zero-shot must reproduce 81.4%).
#   PC: .venv/bin/python -I scripts/sanity_train_day195.py --config configs/experiments/knnvc_day195.yaml --device gpu
base_experiment: configs/experiments/voice_cost_day195.yaml

run_name: knnvc_day195

sanity:
  name: knnvc_day195
  target_variants: [tts_oracle, tts_auto]
  tts_targets:
    config: configs/experiments/manual_alignment_knnvc.yaml
