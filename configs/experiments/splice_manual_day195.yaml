# D-061 (pre-registered): the D-049 dev setting trained on word-splice targets timed by manual (Astra) syllables
# (scripts/word_splice.py --config configs/experiments/word_splice_manual.yaml). Compared with D-060 (same machine,
# test trials and scoring; zero-shot must reproduce 81.4%).
#   PC: .venv/bin/python -I scripts/sanity_train_day195.py --config configs/experiments/splice_manual_day195.yaml --device gpu
base_experiment: configs/experiments/voice_cost_day195.yaml

run_name: splice_manual_day195

sanity:
  name: splice_manual_day195
  target_variants: [splice_manual]
  target_files:
    splice_manual: data/processed/word_splice/day195_manual_from_day025_day193_splice_manual.npz
