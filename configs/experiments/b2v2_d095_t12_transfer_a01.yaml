# D-095 stage A, T12, arm `transfer`, fold a01: T15's adversarial base decoder (frozen) with a NEW, freshly initialized input
# projection, trained text-only (whole-trial CTC, as T15's Kunz input adaptation) on T12's attempted blocks [4, 6, 8, 10];
# tested on attempted block 1 (and, zero-shot, on imagined block 2, the same sentences).
#   PC (gq): /home/molin/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_d095_t12_transfer_a01.yaml
base_experiment: configs/experiments/b2v2_kunz_f03.yaml

run_name: b2v2_d095_t12_transfer_a01

b2v2:
  data_dir: data/processed/b2v2_t12
  adapt:
    decision: D-095
    init: data/checkpoints/b2v2_all_gan/final.pt
    input_init: fresh                # T12's channels correspond to none of T15's
    session: attempted
    train_blocks: [4, 6, 8, 10]
    n_validation: 16                  # 10% of the training trials
    training:
      steps: 3000                    # D-093/D-094's best length; the validation picks the step
      val_every: 50
      checkpoint_every: 500
