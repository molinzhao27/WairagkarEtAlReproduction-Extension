# D-086 arm `read`, fold 03: the D-077 learned map (whole-trial CTC on imagined blocks [7, 9, 12]) with the D-087
# recipe: start from F_03's attempted-speech input, + imagined block 14 (50 new sentences) in training, the paper's
# augmentations throughout. Tested on imagined block 4 (the sentences of attempted block 3, never seen).
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_kunz_d086_read_k03.yaml
base_experiment: configs/experiments/b2v2_kunz_im03.yaml

run_name: b2v2_kunz_d086_read_k03

b2v2:
  adapt:
    decision: D-086
    init: data/checkpoints/b2v2_kunz_f03/best.pt
    copy_from: 1
    extra: [{session: imagined_eval, blocks: [14]}]
    training:
      augment_from: 0.0
