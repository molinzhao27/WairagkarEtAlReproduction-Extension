# D-052 (pre-registered): the D-049 dev setting trained on word-splice targets (scripts/word_splice.py). Compared with
# D-050/D-051 (same machine, test trials and scoring; zero-shot must reproduce 81.4%).
#   PC: .venv/bin/python -I scripts/sanity_train_day195.py --config configs/experiments/splice_day195.yaml --device gpu
base_experiment: configs/experiments/voice_cost_day195.yaml

run_name: splice_day195

sanity:
  name: splice_day195
  target_variants: [splice_oracle, splice_auto]
  target_files:
    splice_oracle: data/processed/word_splice/day195_from_day025_day193_splice_oracle.npz
    splice_auto: data/processed/word_splice/day195_from_day025_day193_splice_auto.npz
