# D-074 (pre-registered): the D-049 dev setting with the voice-transferred decoder (synth_transfer_le165) as the
# starting (and zero-shot) decoder, adapted on Alex targets: the voice of the targets now matches the decoder's core.
#   PC: .venv/bin/python -I scripts/sanity_train_day195.py --config configs/experiments/synth_transfer_day195.yaml --device gpu
base_experiment: configs/experiments/voice_cost_day195.yaml

run_name: synth_transfer_day195

training:
  init:
    path: data/checkpoints/synth_transfer_le165/inference_layer16.h5

sanity:
  name: synth_transfer_day195
  zero_shot_model: data/checkpoints/synth_transfer_le165/inference_layer16.h5
  target_variants: [tts_oracle, tts_auto]
  tts_targets:
    config: configs/experiments/manual_alignment_alex.yaml
