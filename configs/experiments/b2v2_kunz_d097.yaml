# D-097 analysis (PC CPU, gq; scripts/d094_length.py): T15's inner speech with the decoder's first layer trained too.
#   PC: CUDA_VISIBLE_DEVICES= .venv/bin/python -I scripts/d094_length.py --config configs/experiments/b2v2_kunz_d097.yaml
base_experiment: configs/experiments/b2v2_kunz_base.yaml

run_name: b2v2_kunz_d097

b2v2:
  d094:
    decision: D-097
    title: "D-097: T15's inner speech with the decoder's first layer trained too (vast-3; 200 held-out March trials, 2 seeds)"
    out: results/b2v2/d097
    n_trials: 200
    alpha: 0.05
    min_gain: 3.0
    seeds: [s0, s1]
    lengths: [base, unfreeze]
    primary: [{a: unfreeze, b: base}]
    secondary: []
    baselines:                     # context only: trained on the PC (D-094), not the same machine
      len3k_pc_s0: {runs: [b2v2_kunz_d093_noad3k_s0_k03, b2v2_kunz_d093_noad3k_s0_k06, b2v2_kunz_d093_noad3k_s0_k11, b2v2_kunz_d093_noad3k_s0_k13], identify: d093_noad3k_s0}
    cells:
      base_s0: {runs: [b2v2_kunz_d097_base_s0_k03, b2v2_kunz_d097_base_s0_k06, b2v2_kunz_d097_base_s0_k11, b2v2_kunz_d097_base_s0_k13], identify: d097_base_s0}
      base_s1: {runs: [b2v2_kunz_d097_base_s1_k03, b2v2_kunz_d097_base_s1_k06, b2v2_kunz_d097_base_s1_k11, b2v2_kunz_d097_base_s1_k13], identify: d097_base_s1}
      unfreeze_s0: {runs: [b2v2_kunz_d097_unfreeze_s0_k03, b2v2_kunz_d097_unfreeze_s0_k06, b2v2_kunz_d097_unfreeze_s0_k11, b2v2_kunz_d097_unfreeze_s0_k13], identify: d097_unfreeze_s0}
      unfreeze_s1: {runs: [b2v2_kunz_d097_unfreeze_s1_k03, b2v2_kunz_d097_unfreeze_s1_k06, b2v2_kunz_d097_unfreeze_s1_k11, b2v2_kunz_d097_unfreeze_s1_k13], identify: d097_unfreeze_s1}
