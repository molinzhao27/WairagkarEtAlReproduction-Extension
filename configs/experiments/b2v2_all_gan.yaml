# D-086: D-075 stage 2 (b2v2_all) + the paper's adversarial training: a multiscale discriminator on the continuous
# features (wvx.b2v2_model.MultiScaleDiscriminator) after a 5,000-step warm-up. Everything else as b2v2_all.
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_all_gan.yaml
base_experiment: configs/experiments/b2v2_all.yaml

run_name: b2v2_all_gan

b2v2:
  decision: D-086
  training:
    adversarial:
      start: 5000                    # [PAPER] warm-up before any adversarial loss
      ramp: 10000                    # [PAPER] generator weight 0.01 -> 0.1 over 10,000 steps
      w_from: 0.01
      w_to: 0.1
      w_fm: 2.0                      # [PAPER] feature matching
      d_lr: 5.0e-5                   # [PAPER] separate AdamW
      d_weight_decay: 0.01           # [PAPER]
      d_every: 2                     # [PAPER] every alternate batch
      scales: [1, 3, 6]              # [OURS] 50 / 150 / 300 ms on our 50 ms tokens (paper 10 / 40 / 160 / 320 ms)
      channels: [64, 128, 256]       # [PAPER]
      kernel: 3                      # [OURS]
