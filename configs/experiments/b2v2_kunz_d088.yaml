# D-088: a confidence-gated voice on the adversarial-base inner-speech decodes (D-086 `gan_read`): where the phoneme
# read-out is unsure, the voice is turned down. CPU only.
#   PC: PATH=~/wvx/envs/wvx-tools/bin:$PATH CUDA_VISIBLE_DEVICES= nice -n 10 .venv/bin/python -I scripts/postproc_b2v2.py \
#         --config configs/experiments/b2v2_kunz_d088.yaml
#       CUDA_VISIBLE_DEVICES= .venv/bin/python -I scripts/d086_summary.py --config configs/experiments/b2v2_kunz_d088.yaml
#       CUDA_VISIBLE_DEVICES= .venv/bin/python -I scripts/d086_acoustic.py --config configs/experiments/b2v2_kunz_d088.yaml
base_experiment: configs/experiments/b2v2_kunz_base.yaml

run_name: b2v2_kunz_d088

runtime:
  threads: {intra_op: 4, inter_op: 1, omp: 4}

b2v2:
  postproc:
    decision: D-088
    sets:
      d088_ganread:
        runs: [b2v2_kunz_d086_ganread_k03, b2v2_kunz_d086_ganread_k06, b2v2_kunz_d086_ganread_k11, b2v2_kunz_d086_ganread_k13]
        name: imagined
    variants: [orig, gate, gate_10db, gate_40db, gate_centered]
    gates:                           # threshold per fold = the `quantile` of the frame confidence over the speech frames
                                     # (c0 > speech_c0) of the OTHER three folds' decodes
      gate:                          # primary: causal (live-compatible), the last 300 ms, -20 dB
        window: 6                    # 50 ms tokens
        centered: false
        quantile: 0.3                # the least confident 30% of speech frames (D-086 post-hoc: words in the least
                                     # confident 30% are heard right 14% of the time vs 44% for the rest)
        atten_db: 20.0
        smooth: 3                    # 30 ms ramp
        speech_c0: 0.0               # D-084 island threshold
      gate_10db: {window: 6, centered: false, quantile: 0.3, atten_db: 10.0, smooth: 3, speech_c0: 0.0}
      gate_40db: {window: 6, centered: false, quantile: 0.3, atten_db: 40.0, smooth: 3, speech_c0: 0.0}
      gate_centered: {window: 6, centered: true, quantile: 0.3, atten_db: 20.0, smooth: 3, speech_c0: 0.0}   # +150 ms lookahead
    rule: {min_points: 5.0, alpha: 0.05}   # postproc's own WER table only; the D-088 rule is in d086 below
    workers: 4
  d086:                              # read by d086_summary.py / d086_acoustic.py
    decision: D-088
    title: "D-088: confidence-gated voice on the adversarial-base inner-speech decodes (200 held-out trials)"
    out: results/b2v2/d088
    reference: [b2v2_kunz_f03:heldout, b2v2_kunz_f06:heldout, b2v2_kunz_f11:heldout, b2v2_kunz_f13:heldout]
    baseline: gan_read
    secondary_vs: gate
    primary: [gate]
    rule: {kind: extra_words, alpha: 0.05, max_heard_right_drop: 2.0}
    islands: {threshold: 0.0, smooth: 3, min_frames: 10, bridge: 8, cepstra: [1, 18]}
    acoustic:
      attempted: [b2v2_kunz_f03:heldout, b2v2_kunz_f06:heldout, b2v2_kunz_f11:heldout, b2v2_kunz_f13:heldout]
      clean:
        dir: data/processed/f5clone_work/f5_v1_day193/wav16k/kunz_50words
        texts: data/processed/f5clone_work/f5_v1_day193/texts_kunz_50words.json
        qc: data/processed/f5clone_work/f5_v1_day193/qc_kunz_50words_final.json
      mel: {sr: 16000, n_fft: 512, hop: 160, n_mels: 80, fmax: 8000}
      n_mfcc: 25
      trim_db: 35
      perms: 10000
      seed: 20261024
      workers: 14
    arms:
      gan_read: {preds: [b2v2_kunz_d086_ganread_k03:imagined, b2v2_kunz_d086_ganread_k06:imagined, b2v2_kunz_d086_ganread_k11:imagined, b2v2_kunz_d086_ganread_k13:imagined], identify: d086_gan_read}
      gate: {preds: [b2v2_kunz_d086_ganread_k03:imagined, b2v2_kunz_d086_ganread_k06:imagined, b2v2_kunz_d086_ganread_k11:imagined, b2v2_kunz_d086_ganread_k13:imagined], identify: d086_gan_read, postproc: {set: d088_ganread, variant: gate}}
      gate_10db: {preds: [b2v2_kunz_d086_ganread_k03:imagined, b2v2_kunz_d086_ganread_k06:imagined, b2v2_kunz_d086_ganread_k11:imagined, b2v2_kunz_d086_ganread_k13:imagined], identify: d086_gan_read, postproc: {set: d088_ganread, variant: gate_10db}}
      gate_40db: {preds: [b2v2_kunz_d086_ganread_k03:imagined, b2v2_kunz_d086_ganread_k06:imagined, b2v2_kunz_d086_ganread_k11:imagined, b2v2_kunz_d086_ganread_k13:imagined], identify: d086_gan_read, postproc: {set: d088_ganread, variant: gate_40db}}
      gate_centered: {preds: [b2v2_kunz_d086_ganread_k03:imagined, b2v2_kunz_d086_ganread_k06:imagined, b2v2_kunz_d086_ganread_k11:imagined, b2v2_kunz_d086_ganread_k13:imagined], identify: d086_gan_read, postproc: {set: d088_ganread, variant: gate_centered}}
