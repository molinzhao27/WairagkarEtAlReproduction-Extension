# D-051 (pre-registered): the D-049 dev setting with the TTS targets converted toward their voice. Compared with
# D-050 (results/voice_cost_day195: theirs 74.0%, tts_oracle 95.7%, tts_auto 90.0%; zero-shot must reproduce 81.4%).
#   PC: .venv/bin/python -I scripts/sanity_train_day195.py --config configs/experiments/voice_conv_day195.yaml --device gpu
base_experiment: configs/experiments/voice_cost_day195.yaml

run_name: voice_conv_day195

sanity:
  name: voice_conv_day195
  target_variants: [conv_oracle, conv_auto]
  voice_conversion:
    model: data/processed/voice_conversion/aman_to_theirs_word_day193.npz   # scripts/voice_conversion.py
