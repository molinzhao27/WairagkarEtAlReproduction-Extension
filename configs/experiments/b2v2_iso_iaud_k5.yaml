# D-083: text-only (CTC) adaptation of b2v2_all on whole imagined1stAuditory trials of blocks [4, 14]; tested on block 5.
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_iso_iaud_k5.yaml
base_experiment: configs/experiments/b2v2_iso_base.yaml

run_name: b2v2_iso_iaud_k5

b2v2:
  adapt:
    init: data/checkpoints/b2v2_all/final.pt
    session: imagined1stAuditory
    train_blocks: [4, 14]
    full_trial: true
    n_validation: 16
    loss: ctc
    training:
      steps: 1000
      batch_size: 8
      lr: 1.0e-3
      min_lr: 1.0e-5
      warmup: 0.1
      augment_from: 1.0
      val_every: 50
      checkpoint_every: 500
      ctx: 128
      hop: 64
