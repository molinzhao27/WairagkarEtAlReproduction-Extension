# D-095 stage A, T16, arm `random`, fold a04: a randomly initialized decoder (frozen; the control) with a NEW, freshly initialized input
# projection, trained text-only (whole-trial CTC, as T15's Kunz input adaptation) on T16's attempted blocks [1, 6];
# tested on attempted block 4 (and, zero-shot, on imagined block 5, the same sentences).
#   PC (gq): /home/molin/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_d095_t16_random_a04.yaml
base_experiment: configs/experiments/b2v2_kunz_f03.yaml

run_name: b2v2_d095_t16_random_a04

b2v2:
  data_dir: data/processed/b2v2_t16
  adapt:
    decision: D-095
    init: data/checkpoints/b2v2_random_s0/final.pt
    input_init: fresh                # T16's channels correspond to none of T15's
    session: attempted
    train_blocks: [1, 6]
    n_validation: 8                  # 10% of the training trials
    training:
      steps: 3000                    # D-093/D-094's best length; the validation picks the step
      val_every: 50
      checkpoint_every: 500
