# D-200: the causal post-net ("voice from the read-out"), trained on T15's attempted speech with real voice targets.
#   PC (gq): /home/molin/wvx/envs/wvx-f5/bin/python -I scripts/train_postnet.py --config configs/experiments/b2v2_postnet.yaml
base_experiment: configs/experiments/b2v2_base.yaml

run_name: b2v2_postnet

b2v2:
  postnet:
    decision: D-200
    base: data/checkpoints/b2v2_all_gan/final.pt      # T15's adversarial base (input 0), the decoder whose output it reads
    split: results/b2v2/b2v2_all_gan/split.json        # its train / val / test (the benchmark, held out from it too)
    n_train: 2000                                      # a seeded draw from its 8,332 training trials
    ctx: 128
    hop: 64
    threads: 8
    augmentation: {p: 0.8, max_smooth: 15, shrink: [0.6, 1.0], temperature: [1.0, 3.0]}
    model: {d: 256, dilations: [1, 2, 4, 8, 16, 32], k: 3}    # receptive field 127 frames (1.27 s), causal
    training: {seed: 0, steps: 4000, batch_size: 16, window: 400, lr: 1.0e-3, weight_decay: 0.01, val_every: 200}
