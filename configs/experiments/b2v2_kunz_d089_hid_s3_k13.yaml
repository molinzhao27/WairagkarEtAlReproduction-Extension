# D-089 arm `hid` (seed 2), fold 13: `gan_read` + hidden-state distillation: this map's encoder output is pulled
# (cosine) toward the encoder output of the adversarial base's F_13 on the ATTEMPTED version of the same sentence (other
# blocks), warped onto the imagined trial by forced alignment.
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/build_distill_targets.py --config configs/experiments/b2v2_kunz_d089_hid_s3_k13.yaml  (GPU; once per fold)
#       ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_kunz_d089_hid_s3_k13.yaml
base_experiment: configs/experiments/b2v2_kunz_d086_ganread_k13.yaml

run_name: b2v2_kunz_d089_hid_s3_k13

b2v2:
  adapt:
    decision: D-089
    distill:
      kind: hidden
      teacher: data/checkpoints/b2v2_kunz_gan_f13/best.pt
      attempted: b2v2_kunz_gan_f13:attempted_train
      inner: b2v2_kunz_d086_ganread_k13:imagined_train
      targets: data/processed/b2v2_distill/b2v2_kunz_d089_hid_k13.npz   # shared by the three seeds
      weight: 3.0                    # the paper's cosine (SSL) weight 0.3 next to its phoneme weight 0.1
    training:
      seed: 2
