# D-076 check S4.0: the Kunz adaptation method (whole trials through the long-context chunks, labels only, no word
# timings) on the day195 dev setting, to compare with D-075 stage 3's windowed text-only adaptation.
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_le165_adapt_ctc_full.yaml
base_experiment: configs/experiments/b2v2_le165_adapt_ctc.yaml

run_name: b2v2_le165_adapt_ctc_full

b2v2:
  adapt:
    full_trial: true
    training:
      steps: 1000
      batch_size: 8
      val_every: 50
      ctx: 128
      hop: 64
