# D-089 summary: the inner-speech READ-OUT on the adversarial base: hidden-state distillation and 3-member averages.
#   PC: CUDA_VISIBLE_DEVICES= .venv/bin/python -I scripts/d086_summary.py --config configs/experiments/b2v2_kunz_d089.yaml
#       CUDA_VISIBLE_DEVICES= .venv/bin/python -I scripts/d086_acoustic.py --config configs/experiments/b2v2_kunz_d089.yaml
base_experiment: configs/experiments/b2v2_kunz_base.yaml

run_name: b2v2_kunz_d089

b2v2:
  d086:                              # read by d086_summary.py / d086_acoustic.py
    decision: D-089
    title: "D-089: the inner-speech read-out on the adversarial base (200 held-out trials)"
    out: results/b2v2/d089
    reference: [b2v2_kunz_f03:heldout, b2v2_kunz_f06:heldout, b2v2_kunz_f11:heldout, b2v2_kunz_f13:heldout]
    baseline: gan_read
    secondary_vs: ens_read
    primary: [hid, ens_read, ens_hid]
    rule: {kind: per, min_points: 3.0, alpha: 0.0167}   # Bonferroni over the three primary arms
    islands: {threshold: 0.0, smooth: 3, min_frames: 10, bridge: 8, cepstra: [1, 18]}
    acoustic:
      attempted: [b2v2_kunz_f03:heldout, b2v2_kunz_f06:heldout, b2v2_kunz_f11:heldout, b2v2_kunz_f13:heldout]
      clean:
        dir: data/processed/f5clone_work/f5_v1_day193/wav16k/kunz_50words
        texts: data/processed/f5clone_work/f5_v1_day193/texts_kunz_50words.json
        qc: data/processed/f5clone_work/f5_v1_day193/qc_kunz_50words_final.json
      mel: {sr: 16000, n_fft: 512, hop: 160, n_mels: 80, fmax: 8000}
      n_mfcc: 25
      trim_db: 35
      perms: 10000
      seed: 20261024
      workers: 14
    arms:
      gan_read: {preds: [b2v2_kunz_d086_ganread_k03:imagined, b2v2_kunz_d086_ganread_k06:imagined, b2v2_kunz_d086_ganread_k11:imagined, b2v2_kunz_d086_ganread_k13:imagined], identify: d086_gan_read}
      hid: {preds: [b2v2_kunz_d089_hid_s1_k03:imagined, b2v2_kunz_d089_hid_s1_k06:imagined, b2v2_kunz_d089_hid_s1_k11:imagined, b2v2_kunz_d089_hid_s1_k13:imagined], identify: d089_hid}
      ens_read: {preds: [b2v2_kunz_d089_ensread_k03:imagined, b2v2_kunz_d089_ensread_k06:imagined, b2v2_kunz_d089_ensread_k11:imagined, b2v2_kunz_d089_ensread_k13:imagined], identify: d089_ens_read}
      ens_hid: {preds: [b2v2_kunz_d089_enshid_k03:imagined, b2v2_kunz_d089_enshid_k06:imagined, b2v2_kunz_d089_enshid_k11:imagined, b2v2_kunz_d089_enshid_k13:imagined], identify: d089_ens_hid}
