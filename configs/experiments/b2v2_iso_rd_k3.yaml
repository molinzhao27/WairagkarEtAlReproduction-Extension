# D-083: text-only (CTC) adaptation of b2v2_all on whole reading trials of blocks [13]; tested on block 3.
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_iso_rd_k3.yaml
base_experiment: configs/experiments/b2v2_iso_base.yaml

run_name: b2v2_iso_rd_k3

b2v2:
  adapt:
    init: data/checkpoints/b2v2_all/final.pt
    session: reading
    train_blocks: [13]
    full_trial: true
    n_validation: 8
    loss: ctc
    training:
      steps: 1000
      batch_size: 8
      lr: 1.0e-3
      min_lr: 1.0e-5
      warmup: 0.1
      augment_from: 1.0
      val_every: 50
      checkpoint_every: 500
      ctx: 128
      hop: 64
