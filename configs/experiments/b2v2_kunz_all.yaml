# D-076 all attempted blocks: text-only (CTC) adaptation on whole attempted trials of all four blocks;
# tested on the imagined_eval block 14 (new sentences).
#   PC: ~/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2.py --config configs/experiments/b2v2_kunz_all.yaml
base_experiment: configs/experiments/b2v2_kunz_base.yaml

run_name: b2v2_kunz_all

b2v2:
  adapt:
    init: data/checkpoints/b2v2_all/final.pt
    session: attempted
    train_blocks: [3, 6, 11, 13]
    full_trial: true
    n_validation: 20                 # 10% of the 200 training trials: pick the best step by CTC
    loss: ctc
    training:
      steps: 1000
      batch_size: 8                  # whole trials per step
      lr: 1.0e-3
      min_lr: 1.0e-5
      warmup: 0.1
      augment_from: 1.0              # no augmentation
      val_every: 50
      checkpoint_every: 500
      ctx: 128                       # the long-context chunks the decoder runs (D-075 amendment)
      hop: 64
