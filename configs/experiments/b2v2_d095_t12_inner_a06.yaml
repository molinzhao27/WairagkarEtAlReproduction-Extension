# D-095 stage B, T12, fold a06: inner-speech adaptation as D-094's best recipe (D-093 `noad3k`: the pooled
# trainer, one day, no adapter, 3,000 steps) from stage A's `transfer` model of this fold (its T12 input), on
# imagined blocks [2, 3, 7, 9] and the eval blocks [11, 12], minus any trial whose sentence is in the test block; tested on
# imagined block 5 (the sentences of attempted block 6, never trained on).
#   PC (gq): /home/molin/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2_pool.py --config configs/experiments/b2v2_d095_t12_inner_a06.yaml
base_experiment: configs/experiments/b2v2_kunz_d093_noad3k_s0_k03.yaml

run_name: b2v2_d095_t12_inner_a06

b2v2:
  data_dir: data/processed/b2v2_t12
  pool:
    decision: D-095
    init: data/checkpoints/b2v2_d095_t12_transfer_a06/best.pt
    decode_day: t12
    validation_from: [{session: imagined, blocks: [2, 3, 7, 9]}]
    n_validation: 15
    exclude_sentences_of: [{session: attempted, blocks: [6]}]
    days:
      - name: t12
        data_dir: data/processed/b2v2_t12
        copy_from: 1                   # stage A's T12 input
        inner: [{session: imagined, blocks: [2, 3, 7, 9]}, {session: imagined_eval, blocks: [11, 12]}]
