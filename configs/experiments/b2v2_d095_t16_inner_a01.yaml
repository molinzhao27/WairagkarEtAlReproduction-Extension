# D-095 stage B, T16, fold a01: inner-speech adaptation as D-094's best recipe (D-093 `noad3k`: the pooled
# trainer, one day, no adapter, 3,000 steps) from stage A's `transfer` model of this fold (its T16 input), on
# imagined blocks [5, 7] and the eval blocks [14], minus any trial whose sentence is in the test block; tested on
# imagined block 2 (the sentences of attempted block 1, never trained on).
#   PC (gq): /home/molin/wvx/envs/wvx-f5/bin/python -I scripts/train_b2v2_pool.py --config configs/experiments/b2v2_d095_t16_inner_a01.yaml
base_experiment: configs/experiments/b2v2_kunz_d093_noad3k_s0_k03.yaml

run_name: b2v2_d095_t16_inner_a01

b2v2:
  data_dir: data/processed/b2v2_t16
  pool:
    decision: D-095
    init: data/checkpoints/b2v2_d095_t16_transfer_a01/best.pt
    decode_day: t16
    validation_from: [{session: imagined, blocks: [5, 7]}]
    n_validation: 15
    exclude_sentences_of: [{session: attempted, blocks: [1]}]
    days:
      - name: t16
        data_dir: data/processed/b2v2_t16
        copy_from: 1                   # stage A's T16 input
        inner: [{session: imagined, blocks: [5, 7]}, {session: imagined_eval, blocks: [14]}]
