# Base settings shared by every step. Experiment configs in configs/experiments/
# are deep-merged on top of this file (see src/wvx/config.py).
# All paths are relative to the repo root.

seed: 42

paths:
  data_root: data
  raw_kunz: data/raw/kunz/sentenceData
  raw_wairagkar: data/raw/wairagkar
  processed: data/processed
  checkpoints: data/checkpoints        # never committed
  results: results                     # small files only
  figures: figures
  brain_to_voice: third_party/brain_to_voice
  lpcnet: third_party/LPCNet

# The decoder, shared by every step (data adapters, training, inference). Values are theirs:
# third_party/brain_to_voice/configs/config.yaml at commit cff4875.
model:
  n_features: 512          # 256 spike-band power, then 256 threshold crossings, per 10 ms bin
  n_targets: 20            # LPCNet: 18 cepstra + pitch period + pitch correlation
  window_len: 60           # their time_steps: 600 ms of context per prediction
  step_size: 1             # 10 ms between predictions
  transformer_input_shape: [30, 128]
  head_size: 128
  n_heads: 4
  n_transformer_blocks: 8
  mlp_units: [1024, 512]
  dropout: 0.5

runtime:
  # "auto" picks CUDA GPU > Apple Metal GPU > CPU; or force "cpu" / "gpu".
  device: auto
  deterministic_ops: true              # tf.config.experimental.enable_op_determinism()
